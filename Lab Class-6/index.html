<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container container-sm mt-4 light_blue">
        <form action="">
      <div class="row">
        <div class="col mt-5">
          <label for="exampleFormControlInput1" class="form-label"
            >Email address</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder="name@example.com"
          />
        </div>
        <div class="col mt-5">
          <label for="exampleFormControlInput1" class="form-label"
            >Password</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder=". . . . . . . ."
          />
        </div>
      </div>
      <div class="row">
        <div class="col mt-5">
          <label for="exampleFormControlInput1" class="form-label"
            >Full Name</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder=""
          />
        </div>
        <div class="col mt-5">
            <label for="exampleDataList" class="form-label">Department</label>
            <input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Type to search...">
            <datalist id="datalistOptions">
              <option value="IIT">
              <option value="CSE">
              <option value="Physics">
              <option value="Chemistry">
              <option value="Statistics">
            </datalist>
            
        </div>
      </div>
      <div class="row mt-3">
        <div class="col mt-5">
          <label for="exampleFormControlInput1" class="form-label"
            >Permanent address</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleFormControlInput1"
            placeholder=""
          />
        </div>
        <div class="col mt-5 ">
            <select class="form-select form-select mt-4" aria-label=".form-select-sm example">
                <option selected>Nationality</option>
                <option value="1">Bangladeshi</option>
                <option value="2">Nepali</option>
                <option value="3">Others</option>
              </select>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-3 mb-2">
      <div class="form-check ">
        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
        <label class="form-check-label" for="flexCheckDefault">
          C
        </label>
      </div>
    </div>
    <div class="col-3 mb-2">
        <div class="form-check ">
          <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
          <label class="form-check-label" for="flexCheckDefault">
            C++
          </label>
        </div>
      </div>
      <div class="col-3 mb-2">
        <div class="form-check ">
          <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
          <label class="form-check-label" for="flexCheckDefault">
            Java
          </label>
        </div>
      </div>
      <div class="col-3 mb-2">
        <div class="form-check ">
          <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
          <label class="form-check-label" for="flexCheckDefault">
            Python
          </label>
        </div>
      </div>
    </div>
</div>

      <div class="container mt-5" >
        <button type="submit" class="btn btn-primary mb-3">Submit</button>
      </div>
    </form>
    </div>      
   
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
